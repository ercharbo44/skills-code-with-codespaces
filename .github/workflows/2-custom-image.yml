name: Step 2, Custom image check

# This step triggers after First Codespace.
# This workflow updates from step 2 to step 3.

# This will run every time we push to main.
# Reference: https://docs.github.com/en/actions/learn-github-actions/events-that-trigger-workflows
on:
  workflow_dispatch:
  push:
    branches:
      - main

# Reference: https://docs.github.com/en/actions/security-guides/automatic-token-authentication
permissions:
  # Need `contents: read` to checkout the repository.
  # Need `contents: write` to update the step metadata.
  contents: write

jobs:
  # Get the current step to only run the main job when the learner is on the same step.
  get_current_step:
    name: Check current step number
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - id: get_step
        run: |
          echo "current_step=$(cat ./.github/steps/-step.txt)" >> $GITHUB_OUTPUT
    outputs:
      current_step: ${{ steps.get_step.outputs.current_step }}

  on_DependabotPrCreated:
    name: On Creation of a PR
    needs: get_current_step

    # We will only run this action when:
    # 1. This repository isn't the template repository.
    # 2. The step is currently 2.
    # Reference: https://docs.github.com/en/actions/learn-github-actions/contexts
    # Reference: https://docs.github.com/en/actions/learn-github-actions/expressions
    if: >-
      ${{ !github.event.repository.is_template
          && needs.get_current_step.outputs.current_step == 2 }}

    # We'll run Ubuntu for performance instead of Mac or Windows.
    runs-on: ubuntu-latest

    steps:
      # We'll need to check out the repository so that we can edit the README.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Let's get all the branches.

      # Verify the devcontainer.json has an image.
      - name: Check devcontainer.json
        id: check-devcontainer-image
        uses: skills/action-check-file@v1
        with:
          file: ".devcontainer/devcontainer.json"
          search: "mcr\\.microsoft\\.com/vscode/devcontainers/universal:latest"

      # Provide user-friendly error message if check fails
      - name: User-friendly error message
        if: failure() && steps.check-devcontainer-image.outcome == 'failure'
        run: |
          echo "::error::Oops! It looks like your devcontainer.json file is missing or has incorrect content."
          echo ""
          echo "Please make sure you have:"
          echo "  1. Created the file at: .devcontainer/devcontainer.json"
          echo "  2. Added the correct image configuration"
          echo ""
          echo "Your devcontainer.json should include:"
          echo '  "image": "mcr.microsoft.com/vscode/devcontainers/universal:latest"'
          echo ""
          echo "Tips:"
          echo "  - Make sure the folder is named '.devcontainer' (with a dot at the beginning)"
          echo "  - Make sure the file is named 'devcontainer.json' (all lowercase)"
          echo "  - Check for any typos in the image URL"
          echo ""
          echo "For more help, check the instructions in Step 2 of the README."
          exit 1

      # In README.md, switch step 2 for step 3.
      - name: Update to step 3
        uses: skills/action-update-step@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          from_step: 2
          to_step: 3
