name: Step 1, Create codespace and push code

# This step triggers after push to main.
# This workflow updates from step 1 to step 2.

# This will run every time we push to main.
# Reference: https://docs.github.com/en/actions/learn-github-actions/events-that-trigger-workflows
on:
  workflow_dispatch:
  push:
    branches:
      - main

# Reference: https://docs.github.com/en/actions/security-guides/automatic-token-authentication
permissions:
  # Need `contents: read` to checkout the repository.
  # Need `contents: write` to update the step metadata.
  contents: write

jobs:
  # Get the current step to only run the main job when the learner is on the same step.
  get_current_step:
    name: Check current step number
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - id: get_step
        run: |
          echo "current_step=$(cat ./.github/steps/-step.txt)" >> $GITHUB_OUTPUT
    outputs:
      current_step: ${{ steps.get_step.outputs.current_step }}

  on_add_dependency:
    name: On Add dependency
    needs: get_current_step

    # We will only run this action when:
    # 1. This repository isn't the template repository.
    # 2. The step is currently 1.
    # Reference: https://docs.github.com/en/actions/learn-github-actions/contexts
    # Reference: https://docs.github.com/en/actions/learn-github-actions/expressions
    if: >-
      ${{ !github.event.repository.is_template
          && needs.get_current_step.outputs.current_step == 1 }}

    # We'll run Ubuntu for performance instead of Mac or Windows.
    runs-on: ubuntu-latest

    steps:
      # We'll need to check out the repository so that we can edit the README.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Let's get all the branches.

      # Verify the learner added the file contents
      - name: Check workflow contents, jobs
        id: check-index
        uses: skills/action-check-file@v1
        with:
          file: "index.html"
          search: "Hello from the codespace"

      # Provide user-friendly error message if check fails
      - name: User-friendly error message
        if: failure() && steps.check-index.outcome == 'failure'
        run: |
          echo "::error::Oops! It looks like your index.html file doesn't contain the expected content."
          echo ""
          echo "Please make sure your index.html includes the following line:"
          echo ""
          echo '  <h1>Hello from the codespace!</h1>'
          echo ""
          echo "Tips:"
          echo "  1. Open the index.html file in VS Code"
          echo "  2. Replace the existing <h1> content with 'Hello from the codespace!'"
          echo "  3. Save the file"
          echo "  4. Commit and push your changes"
          echo ""
          echo "For more help, check the instructions in Step 1 of the README."
          exit 1

      # In README.md, switch step 1 for step 2.
      - name: Update to step 2
        uses: skills/action-update-step@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          from_step: 1
          to_step: 2
