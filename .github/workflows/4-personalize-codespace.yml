name: Step 4, Personalize your Codespace

# This step triggers after push to main#setup.sh.
# This workflow updates from step 4 to step X.

# This will run every time we push to main#setup.sh.
# Reference: https://docs.github.com/en/actions/learn-github-actions/events-that-trigger-workflows
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "setup.sh"

# Reference: https://docs.github.com/en/actions/security-guides/automatic-token-authentication
permissions:
  # Need `contents: read` to checkout the repository.
  # Need `contents: write` to update the step metadata.
  contents: write

jobs:
  # Get the current step to only run the main job when the learner is on the same step.
  get_current_step:
    name: Check current step number
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - id: get_step
        run: |
          echo "current_step=$(cat ./.github/steps/-step.txt)" >> $GITHUB_OUTPUT
    outputs:
      current_step: ${{ steps.get_step.outputs.current_step }}

  on_update_setup:
    name: On update setup
    needs: get_current_step

    # We will only run this action when:
    # 1. This repository isn't the template repository.
    # 2. The step is currently 4.
    # Reference: https://docs.github.com/en/actions/learn-github-actions/contexts
    # Reference: https://docs.github.com/en/actions/learn-github-actions/expressions
    if: >-
      ${{ !github.event.repository.is_template
          && needs.get_current_step.outputs.current_step == 4}}

    # We'll run Ubuntu for performance instead of Mac or Windows.
    runs-on: ubuntu-latest

    steps:
      # We'll need to check out the repository so that we can edit the README.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Let's get all the branches.

      # Verify the setup.sh added the file contents.
      - name: Check workflow contents, jobs
        id: check-setup
        uses: skills/action-check-file@v1
        with:
          file: "setup.sh"
          search: "install sl"

      # Provide user-friendly error message if check fails
      - name: User-friendly error message
        if: failure() && steps.check-setup.outcome == 'failure'
        run: |
          echo "::error::Oops! It looks like your setup.sh file is missing or has incorrect content."
          echo ""
          echo "Please make sure you have:"
          echo "  1. Created the file named 'setup.sh' in the root of your repository"
          echo "  2. Added the correct content to install the 'sl' command"
          echo ""
          echo "Your setup.sh should include:"
          echo "  sudo apt-get install sl"
          echo ""
          echo "Full example:"
          echo "  #!/bin/bash"
          echo "  sudo apt-get update"
          echo "  sudo apt-get install sl"
          echo '  echo "export PATH=\$PATH:/usr/games" >> ~/.bashrc'
          echo ""
          echo "Tips:"
          echo "  - Make sure to create the file from within your codespace"
          echo "  - Commit and push your changes"
          echo ""
          echo "For more help, check the instructions in Step 4 of the README."
          exit 1

      # In README.md, switch step 4 for step X.
      - name: Update to step X
        uses: skills/action-update-step@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          from_step: 4
          to_step: X
